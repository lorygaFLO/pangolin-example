# Data structure of the project. Folder names marked with `_settings_key`
# are resolved from Settings (overridable via .env).
# Pattern-match step nodes declare both `_pattern_matching: true` and
# `_registry` (the registry YAML driving that step).

reports:
  _description: "Report files"
  _settings_key: "REPORTS_FOLDER_NAME"
  _timestamped: true

# Custom folders (not driven by Settings)
static:
  _description: "Static support files"

# --- Stock forecast pipeline (see pipelines/stock_forecast_pipeline.py) ---
# 0_raw/1_staging/2_transform are ephemeral (_timestamped: true -> a new
# data/stocks/.../<RUN_ID>/ folder every run). 3_history/4_forecast are NOT
# timestamped: same path every run, so history can accumulate and the
# notebook always finds the latest forecast at a fixed location.
stocks:
  _description: "Yahoo Finance download -> validation -> transform -> history -> Chronos forecast"

  0_raw:
    _description: "Per-ticker OHLCV CSVs freshly downloaded from Yahoo Finance"
    _timestamped: true

  backup:
    _description: "Timestamped copy of each run's raw downloads — restore with 'pangolin restore <run_id> --pipeline stock_forecast_pipeline'"
    _timestamped: true

  1_staging:
    _description: "Per-ticker files validated against config/registries/stock_prices_validator.yaml"
    _timestamped: true
    stock_prices_validator:
      _pattern_matching: true
      _registry: "config/registries/stock_prices_validator.yaml"

  2_transform:
    _description: "Per-ticker files with a daily_return_pct column added, per config/registries/stock_transform.yaml"
    _timestamped: true
    stock_transform:
      _pattern_matching: true
      _registry: "config/registries/stock_transform.yaml"

  3_history:
    _description: "Single table, all tickers together (see 'ticker' column): persistent price history, deduplicated by (ticker, date) and accumulated across runs"
    _filename: "stock_prices_history.csv"

  4_forecast:
    _description: "Single table, all tickers together: history + Chronos forecast rows, flagged by 'record_type'"
    _filename: "stock_prices_forecast.csv"
