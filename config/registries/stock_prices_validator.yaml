# Registry for the stock-prices validation step (pipelines/stock_forecast_pipeline.py).
# One glob pattern covers every ticker: "*_STOCK_PRICES.csv" matches
# AMZN_STOCK_PRICES.csv, MSFT_STOCK_PRICES.csv, AAPL_STOCK_PRICES.csv, ...
# as written by custom/processors/yahoo_downloader.py.
#
# Deliberately simple, "obvious" checks — mostly built-in validators
# (pangolin.utils.validators), plus one custom one (custom/validators.py)
# for a check pangolin doesn't ship out of the box.
#
# required_columns below must stay in sync with STOCK_PRICE_COLUMNS in
# custom/processors/_schema.py — this file has to be a plain YAML list (the
# pattern-match step's declarative contract), so it can't import that
# constant, but the two lists are meant to describe the same schema.

"*_STOCK_PRICES.csv":
  validators:
    is_empty_dataframe:
    required_columns:
      - ticker
      - date
      - open
      - high
      - low
      - close
      - volume
    value_range:
      open: { min: 0 }
      high: { min: 0 }
      low: { min: 0 }
      close: { min: 0 }
      volume: { min: 0 }
    # Custom validator defined in custom/validators.py
    max_daily_price_change:
      max_pct_change: 0.5
