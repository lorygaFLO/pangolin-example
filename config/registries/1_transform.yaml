# Registry for the transform step (step 1).
# Transforms run in `order`. Built-in transformers ship with pangolin
# (pangolin/utils/transformers.py); custom ones live in custom/transformers.py.

"*sales*":
  transforms:
    - name: "total_amount_calculation"
      function: "multiply_columns"
      params:
        columns_to_multiply:
          - price
          - quantity
        output_column: total_amount
      order: 1
    # Custom transformer defined in custom/transformers.py
    - name: "ingestion_timestamp"
      function: "add_ingestion_timestamp"
      params:
        column_name: ingested_at
      order: 2
